<style>
  :root{
    --bg:#0d1a2b;
    --bg2:#122439;
    --panel:#0f2036;
    --text:#eef2f6;
    --muted:#8ea3bb;
    --line:rgba(255,255,255,.08);
    --accent:#e8a33d;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(255,255,255,.04), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:820px;
    margin:auto 0;
  }
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.6);
    position:relative;
  }
  .filmstrip{
    height:10px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:var(--accent);
    transition:background .35s ease;
  }
  .filmstrip span{
    width:6px;height:6px;border-radius:50%;
    background:rgba(13,26,43,.55);
  }
  .content{ padding:36px 40px 32px; }

  /* ---------- START SCREEN ---------- */
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:10px;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:32px;
    line-height:1.15;
    margin:0 0 10px;
  }
  .sub{ color:var(--muted); font-size:14.5px; line-height:1.5; margin-bottom:26px; max-width:520px;}
  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,.03); color:var(--text); font-size:13px; cursor:pointer;
    user-select:none; transition:all .15s ease;
  }
  .chip.on{ background:var(--accent); color:#12233d; border-color:var(--accent); font-weight:700;}
  .rowbtns{ display:flex; gap:8px; margin-top:8px;}
  .smallbtn{
    padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:12px; cursor:pointer;
  }
  .smallbtn:hover{ color:var(--text); border-color:rgba(255,255,255,.25);}
  select{
    background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; width:100%; max-width:260px;
  }
  .primary{
    background:var(--accent); color:#12233d; border:none; font-weight:800;
    padding:14px 26px; border-radius:12px; font-size:15px; cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(232,163,61,.5);
    transition:transform .12s ease;
  }
  .primary:hover{ transform:translateY(-1px); }
  .primary:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .ghost{
    background:transparent; border:1px solid var(--line); color:var(--text);
    padding:14px 22px; border-radius:12px; font-size:14.5px; cursor:pointer; font-weight:600;
  }
  .ghost:hover{ border-color:rgba(255,255,255,.3); }

  /* ---------- QUIZ SCREEN ---------- */
  .qbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;
  }
  .catlabel{
    text-transform:uppercase; letter-spacing:.16em; font-size:12px; font-weight:700; color:var(--accent);
  }
  .meta{ display:flex; align-items:center; gap:14px; }
  .count{ color:var(--muted); font-size:13px; }
  .timerwrap{ display:flex; align-items:center; gap:8px; }
  .timernum{
    font-variant-numeric:tabular-nums; font-weight:800; font-size:14px;
    width:30px; text-align:right; color:var(--text);
  }
  .ring{ position:relative; width:28px; height:28px; }
  .ring svg{ transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:3; }
  .ring .track{ stroke:rgba(255,255,255,.12); }
  .ring .prog{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .iconbtn{
    width:34px;height:34px;border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.03);
    color:var(--text); cursor:pointer; display:flex;align-items:center;justify-content:center; font-size:14px;
  }
  .iconbtn:hover{ border-color:rgba(255,255,255,.3); }

  .badgewrap{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .badge{
    width:40px;height:40px;border-radius:10px; background:var(--accent); color:#12233d;
    display:flex;align-items:center;justify-content:center; font-weight:900; font-size:17px; font-family:Georgia,serif;
    flex-shrink:0;
  }
  .fadedq{ color:var(--muted); font-size:14px; line-height:1.4; }

  .qtext{
    font-family:Georgia,'Times New Roman',serif;
    font-size:29px; line-height:1.32; min-height:120px; display:flex; align-items:center;
  }
  .atext{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700; font-size:38px; line-height:1.25; color:var(--accent); min-height:110px;
    display:flex; align-items:center;
  }
  .footer{ display:flex; align-items:center; justify-content:space-between; margin-top:24px; gap:12px; flex-wrap:wrap;}
  .hint{ color:var(--muted); font-size:12.5px; }
  .gradebtns{ display:flex; gap:10px; }
  .gradebtn{
    padding:11px 20px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03);
    color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
  }
  .gradebtn.miss:hover{ border-color:#c15b5b; color:#e08a8a; }
  .gradebtn.got:hover{ border-color:#4fb286; color:#7ed3ab; }

  .pauseOverlay{
    position:absolute; inset:0; background:rgba(9,17,29,.88); backdrop-filter:blur(2px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center;
  }
  .pauseOverlay h2{ font-family:Georgia,serif; font-size:26px; margin:0; }

  /* ---------- END SCREEN ---------- */
  .scoreBig{ font-family:Georgia,serif; font-size:52px; font-weight:800; color:var(--accent); margin:6px 0 4px;}
  .breakdown{ margin-top:24px; border-top:1px solid var(--line); padding-top:18px; }
  .brow{ display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px; border-bottom:1px dashed var(--line); }
  .brow .cn{ color:var(--text); }
  .brow .cs{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .actions{ display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; }

  @media (max-width:560px){
    .content{ padding:26px 20px 24px; }
    h1{ font-size:26px; }
    .qtext{ font-size:23px; }
    .atext{ font-size:30px; }
  }
</style>
</head>

const QUESTIONS = RAW.map((r,i)=>({id:i, cat:r[0], q:r[1], a:r[2]}));
const CATEGORIES = [...new Set(QUESTIONS.map(q=>q.cat))];
const PALETTE = ["#e8a33d","#4fb286","#c15b5b","#6c8fc7","#b98bd1","#d4c05e","#5fafaf","#d17a9e","#8fa85e","#c98a4b","#7ea0e0","#e0a8c8"];
const catColor = {};
CATEGORIES.forEach((c,i)=>catColor[c]=PALETTE[i%PALETTE.length]);

/* ===================== STATE ===================== */
let state = {
  screen:'start',        // start | quiz | end
  selectedCats: new Set(CATEGORIES),
  count: 20,
  timerDur: 15,           // seconds, 0 = off
  session: [],
  idx: 0,
  phase: 'q',             // q | a
  remaining: 0,
  paused: false,
  timerId: null,
  stats: {},              // cat -> {correct,total}
  scoreCorrect: 0,
  scoreSeen: 0,
  missedIds: new Set()
};

const el = document.getElementById('content');
const filmstripEl = document.getElementById('filmstrip');

function setAccent(color){
  document.documentElement.style.setProperty('--accent', color);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ===================== RENDER: START ===================== */
function renderStart(){
  setAccent(PALETTE[0]);
  const maxCount = QUESTIONS.length;
  el.innerHTML = `
    <div class="eyebrow">History, Earth Science &amp; Global Literacy</div>
    <h1>Watch, Guess, Learn</h1>
    <div class="sub">A question appears on screen with a countdown. Answer it in your head before time runs out — pause anytime if you need more room to think — then reveal the answer and grade yourself.</div>

    <div class="field">
      <label>Categories</label>
      <div class="chiprow" id="catChips"></div>
      <div class="rowbtns">
        <button class="smallbtn" id="allBtn">Select all</button>
        <button class="smallbtn" id="noneBtn">Clear</button>
      </div>
    </div>

    <div class="field" style="display:flex; gap:28px; flex-wrap:wrap;">
      <div>
        <label>Questions this round</label>
        <select id="countSel"></select>
      </div>
      <div>
        <label>Timer per question</label>
        <select id="timerSel">
          <option value="10">10 seconds</option>
          <option value="15" selected>15 seconds</option>
          <option value="20">20 seconds</option>
          <option value="0">No timer</option>
        </select>
      </div>
    </div>

    <button class="primary" id="startBtn">Start Quiz</button>
  `;

  const chipWrap = document.getElementById('catChips');
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip on';
    chip.textContent = cat;
    chip.style.setProperty('--accent', catColor[cat]);
    chip.onclick = ()=>{
      if(state.selectedCats.has(cat)){ state.selectedCats.delete(cat); chip.classList.remove('on'); }
      else { state.selectedCats.add(cat); chip.classList.add('on'); }
      refreshCountOptions();
    };
    chipWrap.appendChild(chip);
  });

  document.getElementById('allBtn').onclick = ()=>{
    state.selectedCats = new Set(CATEGORIES);
    renderStart();
  };
  document.getElementById('noneBtn').onclick = ()=>{
    state.selectedCats = new Set();
    renderStart();
  };

  const countSel = document.getElementById('countSel');
  function refreshCountOptions(){
    const avail = QUESTIONS.filter(q=>state.selectedCats.has(q.cat)).length;
    const options = [10,15,20,30,40,avail].filter((v,i,a)=>v>0 && v<=avail && a.indexOf(v)===i);
    countSel.innerHTML = options.map(v=>`<option value="${v}">${v===avail? 'All ('+avail+')' : v}</option>`).join('');
    if(!options.includes(state.count)) state.count = options[Math.min(1,options.length-1)] || avail;
    countSel.value = state.count;
    document.getElementById('startBtn').disabled = avail === 0;
  }
  refreshCountOptions();
  countSel.onchange = ()=> state.count = parseInt(countSel.value,10);

  const timerSel = document.getElementById('timerSel');
  timerSel.value = String(state.timerDur);
  timerSel.onchange = ()=> state.timerDur = parseInt(timerSel.value,10);

  document.getElementById('startBtn').onclick = startQuiz;
}

/* ===================== QUIZ LOGIC ===================== */
function startQuiz(){
  const pool = QUESTIONS.filter(q=>state.selectedCats.has(q.cat));
  state.session = shuffle(pool).slice(0, state.count);
  state.idx = 0;
  state.phase = 'q';
  state.paused = false;
  state.stats = {};
  state.scoreCorrect = 0;
  state.scoreSeen = 0;
  state.missedIds = new Set();
  state.screen = 'quiz';
  renderQuiz();
}

function currentQ(){ return state.session[state.idx]; }

function clearTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

function startTimer(){
  clearTimer();
  if(state.timerDur <= 0) return;
  state.remaining = state.timerDur;
  updateTimerUI();
  state.timerId = setInterval(()=>{
    if(state.paused) return;
    state.remaining -= 1;
    updateTimerUI();
    if(state.remaining <= 0){
      clearTimer();
      revealAnswer();
    }
  },1000);
}

function updateTimerUI(){
  const numEl = document.getElementById('timernum');
  const progEl = document.getElementById('ringprog');
  if(!numEl) return;
  numEl.textContent = state.remaining;
  const total = state.timerDur;
  const circumference = 2*Math.PI*11;
  const pct = Math.max(0, state.remaining/total);
  progEl.style.strokeDasharray = circumference;
  progEl.style.strokeDashoffset = circumference * (1-pct);
}

function renderQuiz(){
  const item = currentQ();
  const color = catColor[item.cat];
  setAccent(color);
  const n = state.idx+1, total = state.session.length;

  const timerHTML = state.timerDur>0 ? `
    <div class="timerwrap">
      <div class="ring">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <circle class="track" cx="14" cy="14" r="11"></circle>
          <circle class="prog" id="ringprog" cx="14" cy="14" r="11"></circle>
        </svg>
      </div>
      <div class="timernum" id="timernum">${state.timerDur}</div>
    </div>` : `<div class="count">no timer</div>`;

  if(state.phase === 'q'){
    el.innerHTML = `
      <div class="qbar">
        <div class="catlabel">${item.cat}</div>
        <div class="meta">
          <div class="count">${n} / ${total}</div>
          ${timerHTML}
          <button class="iconbtn" id="pauseBtn" title="Pause">⏸</button>
        </div>
      </div>
      <div class="badgewrap"><div class="badge">Q</div></div>
      <div class="qtext">${item.q}</div>
      <div class="footer">
        <div class="hint">Press space or click to reveal</div>
        <button class="primary" id="revealBtn">Reveal Answer</button>
      </div>
    `;
    document.getElementById('revealBtn').onclick = revealAnswer;
    document.getElementById('pauseBtn').onclick = togglePause;
    startTimer();
  } else {
    clearTimer();
    el.innerHTML = `
      <div class="qbar">
        <div class="catlabel">${item.cat}</div>
        <div class="meta">
          <div class="count">${n} / ${total}</div>
        </div>
      </div>
      <div class="badgewrap">
        <div class="badge">A</div>
        <div class="fadedq">${item.q}</div>
      </div>
      <div class="atext">${item.a}</div>
      <div class="footer">
        <div class="hint">How'd you do?</div>
        <div class="gradebtns">
          <button class="gradebtn miss" id="missBtn">✕ Missed it</button>
          <button class="gradebtn got" id="gotBtn">✓ Got it</button>
        </div>
      </div>
    `;
    document.getElementById('missBtn').onclick = ()=>grade(false);
    document.getElementById('gotBtn').onclick = ()=>grade(true);
  }
}

function revealAnswer(){
  clearTimer();
  state.phase = 'a';
  renderQuiz();
}

function grade(correct){
  const item = currentQ();
  if(!state.stats[item.cat]) state.stats[item.cat] = {correct:0,total:0};
  state.stats[item.cat].total += 1;
  if(correct){ state.stats[item.cat].correct += 1; }
  else { state.missedIds.add(item.id); }
  state.scoreSeen += 1;
  if(correct) state.scoreCorrect += 1;

  if(state.idx+1 >= state.session.length){
    state.screen = 'end';
    renderEnd();
  } else {
    state.idx += 1;
    state.phase = 'q';
    renderQuiz();
  }
}

function togglePause(){
  state.paused = !state.paused;
  if(state.paused){
    const overlay = document.createElement('div');
    overlay.className = 'pauseOverlay';
    overlay.id = 'pauseOverlay';
    overlay.innerHTML = `<h2>Paused</h2><button class="primary" id="resumeBtn">Resume</button>`;
    document.querySelector('.card').appendChild(overlay);
    document.getElementById('resumeBtn').onclick = togglePause;
  } else {
    const o = document.getElementById('pauseOverlay');
    if(o) o.remove();
  }
}

/* ===================== END SCREEN ===================== */
function renderEnd(){
  clearTimer();
  setAccent(PALETTE[1]);
  const pct = state.scoreSeen ? Math.round(100*state.scoreCorrect/state.scoreSeen) : 0;
  const rows = Object.keys(state.stats).sort().map(cat=>{
    const s = state.stats[cat];
    return `<div class="brow"><div class="cn" style="color:${catColor[cat]}">${cat}</div><div class="cs">${s.correct} / ${s.total}</div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="eyebrow">Round complete</div>
    <h1>Nice work.</h1>
    <div class="scoreBig">${state.scoreCorrect} / ${state.scoreSeen}</div>
    <div class="sub">${pct}% self-graded correct</div>
    <div class="breakdown">${rows}</div>
    <div class="actions">
      <button class="primary" id="retryBtn">Retry Same Set</button>
      <button class="ghost" id="missedBtn" ${state.missedIds.size===0 ? 'disabled':''}>Retry Missed Only (${state.missedIds.size})</button>
      <button class="ghost" id="newBtn">New Session</button>
    </div>
  `;

  document.getElementById('retryBtn').onclick = ()=>{
    state.idx=0; state.phase='q'; state.paused=false; state.stats={}; state.scoreCorrect=0; state.scoreSeen=0; state.missedIds=new Set();
    state.session = shuffle(state.session);
    state.screen='quiz'; renderQuiz();
  };
  document.getElementById('newBtn').onclick = ()=>{ state.screen='start'; renderStart(); };
  const missedBtn = document.getElementById('missedBtn');
  if(missedBtn && !missedBtn.disabled){
    missedBtn.onclick = ()=>{
      state.session = shuffle(QUESTIONS.filter(q=>state.missedIds.has(q.id)));
      state.idx=0; state.phase='q'; state.paused=false; state.stats={}; state.scoreCorrect=0; state.scoreSeen=0; state.missedIds=new Set();
      state.screen='quiz'; renderQuiz();
    };
  }
}

/* ===================== KEYBOARD ===================== */
document.addEventListener('keydown', (e)=>{
  if(state.screen !== 'quiz') return;
  if(e.code === 'Space'){
    e.preventDefault();
    if(state.phase==='q') revealAnswer();
  }
  if(e.key==='p' || e.key==='P'){
    togglePause();
  }
});

/* ===================== INIT ===================== */
renderStart();
</script>
</body>
</html>
